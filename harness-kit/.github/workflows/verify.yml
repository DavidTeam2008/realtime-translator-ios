name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kit end-to-end tests
        run: python3 -m unittest discover -s tests -q
