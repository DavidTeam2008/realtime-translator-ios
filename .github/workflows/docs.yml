name: docs

on:
  push:
    paths:
      - "**/*.md"
      - "tools/check-docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "tools/check-docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs links, fences and index
        run: python3 tools/check-docs.py
